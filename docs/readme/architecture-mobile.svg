<svg xmlns="http://www.w3.org/2000/svg" width="460" height="734" viewBox="0 0 460 734" role="img" aria-labelledby="title desc"><title id="title">Second Voice architecture</title><desc id="desc">Guarded rewrite architecture. The writing interface is available without enabling owner-funded AI requests.</desc><rect width="460" height="734" fill="#fff"/><rect x="1" y="1" width="458" height="732" rx="13" fill="none" stroke="#D8E0E6"/><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="46" font-size="30" font-weight="700" fill="#15202C">Second Voice</text><text x="20" y="77" font-size="16" fill="#536171">Guarded rewrite architecture</text><rect x="20" y="111" width="420" height="156" rx="11" fill="#F8FAFB" stroke="#D8E0E6"/><rect x="20" y="111" width="4" height="156" rx="2" fill="#357B63"/><text x="40" y="136" fill="#357B63" font-size="13" font-weight="700" letter-spacing="1">INTERFACE</text><text x="40" y="171" fill="#15202C" font-size="24" font-weight="700">Writing studio</text><text x="40" y="198" fill="#536171" font-size="17">Next.js / React</text><text x="40" y="228" fill="#233244" font-size="16">Original beside rewrite</text><text x="40" y="251" fill="#233244" font-size="16">Share only when chosen</text><path d="M230 267v20m-6-6 6 6 6-6" fill="none" stroke="#357B63" stroke-width="2"/><rect x="20" y="287" width="420" height="156" rx="11" fill="#F8FAFB" stroke="#D8E0E6"/><rect x="20" y="287" width="4" height="156" rx="2" fill="#357B63"/><text x="40" y="312" fill="#357B63" font-size="13" font-weight="700" letter-spacing="1">GATEWAY</text><text x="40" y="347" fill="#15202C" font-size="24" font-weight="700">Governed rewrite</text><text x="40" y="374" fill="#536171" font-size="17">Server route and policy</text><text x="40" y="404" fill="#233244" font-size="16">Request and session checks</text><text x="40" y="427" fill="#233244" font-size="16">Validated model output</text><path d="M230 443v20m-6-6 6 6 6-6" fill="none" stroke="#357B63" stroke-width="2"/><rect x="20" y="463" width="420" height="156" rx="11" fill="#F8FAFB" stroke="#D8E0E6"/><rect x="20" y="463" width="4" height="156" rx="2" fill="#357B63"/><text x="40" y="488" fill="#357B63" font-size="13" font-weight="700" letter-spacing="1">PRIVATE SERVICES</text><text x="40" y="523" fill="#15202C" font-size="24" font-weight="700">Budget and provider</text><text x="40" y="550" fill="#536171" font-size="17">Supabase / gated Groq</text><text x="40" y="580" fill="#233244" font-size="16">Durable quotas and results</text><text x="40" y="603" fill="#233244" font-size="16">Paid calls off by default</text><rect x="20" y="642" width="420" height="78" rx="8" fill="#F0F4F6"/><rect x="20" y="642" width="4" height="78" rx="2" fill="#357B63"/><text x="40" y="676" font-size="16" fill="#364556">The writing interface is available without</text><text x="40" y="700" font-size="16" fill="#364556">enabling owner-funded AI requests.</text></g></svg>