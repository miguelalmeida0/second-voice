name: One-time branch shape cleanup

permissions:
  contents: write

on:
  push:
    branches:
      - test
    paths:
      - .github/workflows/one-time-branch-shape.yml
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Preserve Duet history on test and remove superseded branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git show-ref --verify --quiet refs/remotes/origin/main
          git show-ref --verify --quiet refs/remotes/origin/test
          git show-ref --verify --quiet refs/remotes/origin/design/duet-responsive
          git merge-base --is-ancestor refs/remotes/origin/design/duet-responsive refs/remotes/origin/test
          git push origin --delete design/duet-responsive

      - name: Verify exact branch shape
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(git ls-remote --heads origin | awk '{sub("refs/heads/","",$2); print $2}' | sort)
          printf '%s\n' "${branches[@]}"
          expected=$'main\ntest'
          actual="$(printf '%s\n' "${branches[@]}")"
          test "$actual" = "$expected"
