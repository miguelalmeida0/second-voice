name: Instant studio

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-paint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run test:security
      - run: npm run test:scroll
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:instant
      - run: npx playwright test --project chromium --project mobile-chrome tests/e2e/specs/duet.spec.ts tests/e2e/specs/auth.spec.ts tests/e2e/specs/error-states.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: instant-studio-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
